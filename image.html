<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>随机动漫风格图片瀑布流展示</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      padding: 20px;
      margin: 0;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 10px;
    }

    .image-container {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      background-color: white;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    img {
      width: 100%;
      height: auto;
      display: block;
    }

    .download-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 5px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .download-btn:hover {
      background-color: rgba(0, 0, 0, 0.9);
    }
  </style>
</head>

<body>
  <h1>随机动漫风格图片瀑布流</h1>
  <div class="gallery" id="gallery">
    <!-- 图片将被动态插入到这里 -->
  </div>

  <script>
    // 创建100张图片并插入到瀑布流中
    const gallery = document.getElementById("gallery");

    // 创建一个插入图片的函数
    function createImageElement(imageUrl) {
      const container = document.createElement("div");
      container.classList.add("image-container");

      // 创建img标签并设置src
      const img = document.createElement("img");
      img.src = imageUrl;
      img.alt = "随机动漫图片";

      // 创建下载按钮
      const downloadButton = document.createElement("button");
      downloadButton.classList.add("download-btn");
      downloadButton.innerText = "下载";
      downloadButton.onclick = () => downloadImage(imageUrl);

      // 将img和下载按钮插入到容器中
      container.appendChild(img);
      container.appendChild(downloadButton);

      // 将容器插入到瀑布流中
      gallery.appendChild(container);
    }

    // 下载图片的函数
    function downloadImage(imageUrl) {
      const link = document.createElement("a");
      link.href = imageUrl;
      link.download = imageUrl.split('/').pop(); // 使用图片的文件名作为下载文件名
      document.body.appendChild(link); // 必须将链接添加到 DOM
      link.click(); // 模拟点击链接以下载
      document.body.removeChild(link); // 移除链接
    }

    // 延时函数
    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // 获取100张不同的图片并插入到页面，控制请求间隔
    async function fetchImages() {
      for (let i = 0; i < 5; i++) {
        const imageUrl = `https://api.yimian.xyz/img?type=moe&size=1920x1080&num=${i}`; // 添加num参数
        createImageElement(imageUrl);

        // 随机等待200-500毫秒
        const delayTime = Math.random() * 300 + 200; // 随机延时 200-500 毫秒
        await delay(delayTime); // 每次请求后等待一段时间
      }
    }

    // 开始加载图片
    fetchImages(); // 调用一次函数，开始加载图片
  </script>
</body>

</html>
